services:
  - type: web
    name: image-protection-toolkit
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --timeout 180 --workers 2 app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
